  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

*/\n@font-face {\n  font-family: 'Quicksand';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"0fc59421-994d-42e6-a615-5ed4fa1a23ba\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Quicksand';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d98f9cf9-ced4-4550-b3fd-0519ac7521a3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    * { box-sizing: border-box; }\n    body { margin: 0; background: #F7F6F3; font-family: 'Inter', sans-serif; }\n    input:not([type=\"checkbox\"]), textarea, select { font-family:'Inter',sans-serif; font-size:15px; padding:10px 12px; border-radius:10px; border:1px solid #DDD9EE; background:#fff; color:#3D3555; width:100%; appearance:none; -webkit-appearance:none; }\n    input:focus, textarea:focus, select:focus { outline:2px solid #A09CDE; }\n    input[type=\"checkbox\"] { width:18px; height:18px; accent-color:#4E2780; cursor:pointer; flex-shrink:0; }\n    label { font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; color:#736EB4; margin-bottom:4px; display:block; }\n    a { color: #4E2780; }\n    a:hover { color: #AB1D79; }\n    button { cursor:pointer; font-family:'Quicksand',sans-serif; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; padding:40px 20px; text-align:center; gap:16px;\">\n    <div style=\"width:64px; height:64px; border-radius:50%; background:#EFEBFA; display:flex; align-items:center; justify-content:center; font-size:30px;\">✓<\u002Fdiv>\n    <div style=\"font-family:'Quicksand',sans-serif; font-weight:700; font-size:22px; color:#3D3555; max-width:480px;\">¡Registro enviado con éxito!<\u002Fdiv>\n    <div style=\"font-size:15px; color:#6B6580; line-height:1.6; max-width:440px;\">Ya hemos recibido tus datos. En breve recibirás tu informe de evaluación de sueño gratuita por correo electrónico. Gracias por tu tiempo.<\u002Fdiv>\n    <button sc-camel-on-click=\"{{ onStartNew }}\" style=\"margin-top:10px; background:#4E2780; color:#fff; border:none; border-radius:10px; padding:11px 22px; font-size:14px; font-weight:600;\">Volver al inicio<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ !submitted }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex; flex-direction:column; align-items:center; padding:20px 14px 60px; gap:16px; max-width:100%;\">\n\n  <div style=\"width:100%; max-width:620px; background:#fff; border-radius:16px; padding:22px 22px 20px; display:flex; gap:14px; align-items:flex-start;\">\n    <img src=\"afae62cf-87d5-4a65-a08a-db76b76b0480\" style=\"width:52px; height:52px; object-fit:contain; flex-shrink:0;\">\n    <div>\n      <div style=\"font-family:'Quicksand',sans-serif; font-weight:700; font-size:19px; color:#3D3555; margin-bottom:6px;\">Evaluación de sueño gratuita<\u002Fdiv>\n      <div style=\"font-size:13.5px; color:#6B6580; line-height:1.55; margin-bottom:10px;\">Este registro está pensado para bebés a partir de 4-6 meses, edad en la que el sueño empieza a organizarse en patrones reconocibles. Si tu peque es más pequeño, puedes rellenarlo igualmente; ten en cuenta que a esa edad el sueño aún está en pleno desarrollo.<\u002Fdiv>\n      <div style=\"font-size:13.5px; color:#6B6580; line-height:1.55;\">Como parte de tu evaluación de sueño gratuita, rellena este registro durante los próximos días, sin cambiar vuestra rutina habitual. Con estos datos prepararé una primera valoración de cómo duerme tu peque. Solo tardarás un par de minutos cada día. Lo ideal es registrar una semana completa (7 días), aunque 5 días también es una muestra válida — si son 5, procura que incluyan al menos un fin de semana.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:100%; max-width:620px; background:#fff; border-radius:16px; padding:16px 18px; display:grid; grid-template-columns:1fr 1fr; gap:12px;\">\n    <div>\n      <label>Nombre del bebé<\u002Flabel>\n      <input value=\"{{ familyLabel }}\" sc-camel-on-change=\"{{ onFamilyLabel }}\" placeholder=\"Nombre\">\n    <\u002Fdiv>\n    <div>\n      <label>Fecha de nacimiento <span style=\"font-weight:400; color:#9994B8;\">({{ babyAgeLabel }})<\u002Fspan><\u002Flabel>\n      <input type=\"date\" value=\"{{ babyBirthDate }}\" sc-camel-on-change=\"{{ onBabyBirthDate }}\">\n    <\u002Fdiv>\n    <div style=\"grid-column:1 / -1;\">\n      <label>Tu nombre (madre/padre)<\u002Flabel>\n      <input value=\"{{ parentName }}\" sc-camel-on-change=\"{{ onParentName }}\" placeholder=\"Nombre y apellidos\">\n    <\u002Fdiv>\n    <div>\n      <label>Email<\u002Flabel>\n      <input type=\"email\" value=\"{{ parentEmail }}\" sc-camel-on-change=\"{{ onParentEmail }}\" placeholder=\"tu@email.com\">\n    <\u002Fdiv>\n    <div>\n      <label>Teléfono<\u002Flabel>\n      <input type=\"tel\" value=\"{{ parentPhone }}\" sc-camel-on-change=\"{{ onParentPhone }}\" placeholder=\"600 000 000\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:100%; max-width:620px; background:#fff; border:2px solid #DDD9EE; border-radius:16px; padding:16px 18px; display:grid; grid-template-columns:1fr 1fr; gap:12px;\">\n    <div style=\"grid-column:1 / -1; display:flex; align-items:flex-start; gap:8px; margin-top:4px;\">\n      <input type=\"checkbox\" style=\"width:auto; margin-top:3px;\" checked=\"{{ marketingConsent }}\" sc-camel-on-change=\"{{ onMarketingConsent }}\">\n      <label style=\"font-weight:400; color:#A6A2B8; margin-bottom:0;\">Acepto que Escuela de Sueño guarde mis datos de contacto para enviarme información, consejos y promociones relacionadas con el sueño infantil. Podré darme de baja de estas comunicaciones cuando quiera.<\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"grid-column:1 / -1;\">\n      <label>Cuéntame brevemente el caso<\u002Flabel>\n      <textarea rows=\"2\" style=\"resize:vertical;\" value=\"{{ caseContext }}\" sc-camel-on-change=\"{{ onCaseContext }}\" placeholder=\"En pocas líneas, qué os trae por aquí\"><\u002Ftextarea>\n    <\u002Fdiv>\n    <div>\n      <label>Alimentación<br><br><\u002Flabel>\n      <sc-raw-select value=\"{{ feeding }}\" sc-camel-on-change=\"{{ onFeeding }}\">\n        <option value=\"\">Selecciona…<\u002Foption>\n        <option value=\"lactancia materna\">Lactancia materna<\u002Foption>\n        <option value=\"formula\">Fórmula<\u002Foption>\n        <option value=\"mixta\">Mixta<\u002Foption>\n      <\u002Fsc-raw-select>\n    <\u002Fdiv>\n    <div>\n      <label>¿Habéis iniciado ya la alimentación complementaria (AC)?<\u002Flabel>\n      <sc-raw-select value=\"{{ acStarted }}\" sc-camel-on-change=\"{{ onAcStarted }}\">\n        <option value=\"\">Selecciona…<\u002Foption>\n        <option value=\"no\">No<\u002Foption>\n        <option value=\"si\">Sí<\u002Foption>\n      <\u002Fsc-raw-select>\n    <\u002Fdiv>\n    <div>\n      <label>¿Lleva una evolución de peso gradual?<\u002Flabel>\n      <sc-raw-select value=\"{{ weightOk }}\" sc-camel-on-change=\"{{ onWeightOk }}\">\n        <option value=\"\">Selecciona…<\u002Foption>\n        <option value=\"si\">Sí<\u002Foption>\n        <option value=\"no\">No<\u002Foption>\n      <\u002Fsc-raw-select>\n    <\u002Fdiv>\n    <div>\n      <label>¿Nació a término o prematuro?<\u002Flabel>\n      <sc-raw-select value=\"{{ termType }}\" sc-camel-on-change=\"{{ onTermType }}\">\n        <option value=\"\">Selecciona…<\u002Foption>\n        <option value=\"termino\">A término<\u002Foption>\n        <option value=\"prematuro\">Prematuro<\u002Foption>\n      <\u002Fsc-raw-select>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isPremature }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <label>Semanas + días de gestación al nacer <span style=\"font-weight:400; color:#9994B8;\">({{ correctedAgeLabel }})<\u002Fspan><\u002Flabel>\n        <input value=\"{{ gestWeeks }}\" sc-camel-on-change=\"{{ onGestWeeks }}\" placeholder=\"ej. 34+2\">\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div>\n      <label>¿Tiene o ha tenido algún problema médico o de desarrollo?<\u002Flabel>\n      <sc-raw-select value=\"{{ medicalIssue }}\" sc-camel-on-change=\"{{ onMedicalIssue }}\">\n        <option value=\"\">Selecciona…<\u002Foption>\n        <option value=\"no\">No<\u002Foption>\n        <option value=\"si\">Sí<\u002Foption>\n      <\u002Fsc-raw-select>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasMedicalIssue }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <label>Describe:<br><br><\u002Flabel>\n        <input value=\"{{ medicalIssueDetail }}\" sc-camel-on-change=\"{{ onMedicalIssueDetail }}\">\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"grid-column:1 / -1;\">\n      \n      \n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ marketingConsentMissing }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"width:100%; max-width:620px; background:#fff; border-radius:16px; padding:18px; text-align:center; color:#4E2780; font-size:14px; font-weight:600;\">Marca la casilla de aceptación de arriba para poder empezar a rellenar el registro. 👆<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ marketingConsent }}\" hint-placeholder-val=\"{{ false }}\">\n\n  <div style=\"width:100%; max-width:620px; background:#fff; border-radius:16px; padding:8px 18px 4px;\">\n    <label>Fecha de inicio del registro&nbsp;<\u002Flabel>\n    <input type=\"date\" value=\"{{ startDate }}\" sc-camel-on-change=\"{{ onStartDate }}\" style=\"max-width:200px;\">\n  <\u002Fdiv>\n\n  <div style=\"width:100%; max-width:620px; display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;\">\n    <sc-for list=\"{{ dayTabs }}\" as=\"tab\" hint-placeholder-count=\"7\">\n      <button sc-camel-on-click=\"{{ tab.onSelect }}\" style=\"{{ tab.style }}\">{{ tab.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"width:100%; max-width:620px; background:#FFF6E9; border-radius:12px; padding:10px 14px; font-size:12.5px; color:#8A6A2F; font-weight:600;\">🕐 Usa el formato de 24 horas (ej. 22:00 para las 10 de la noche, no 10:00).<\u002Fdiv>\n\n  <!-- DESPERTAR MAÑANA -->\n  <div id=\"despertar-manana\" style=\"width:100%; max-width:620px; background:#fff; border-radius:16px; padding:18px;\">\n    <div style=\"font-family:'Quicksand',sans-serif; font-weight:700; font-size:15px; color:#3D3555; margin-bottom:10px;\">Despertar de la mañana<\u002Fdiv>\n    <label>Hora de despertar<\u002Flabel>\n    <input type=\"time\" value=\"{{ curDay.wakeMorning }}\" sc-camel-on-change=\"{{ curDay.onWakeMorning }}\">\n  <\u002Fdiv>\n\n  <!-- SIESTAS -->\n  <div style=\"width:100%; max-width:620px; background:#fff; border-radius:16px; padding:18px;\">\n    <div style=\"font-family:'Quicksand',sans-serif; font-weight:700; font-size:15px; color:#3D3555; margin-bottom:12px;\">Siestas<\u002Fdiv>\n    <sc-if value=\"{{ curDay.noNaps }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:12.5px; color:#9994B8; margin-bottom:8px;\">Sin siestas registradas este día.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-for list=\"{{ curDay.naps }}\" as=\"nap\" hint-placeholder-count=\"0\">\n      <div style=\"border-top:1px solid #EEECF6; padding-top:12px; margin-top:12px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;\">\n          <div style=\"font-family:'Quicksand',sans-serif; font-weight:600; font-size:13.5px; color:#4E2780;\">Siesta {{ nap.n }}<\u002Fdiv>\n          <div style=\"font-size:11.5px; color:#9994B8;\">Ventana antes: {{ nap.ventana }} · Latencia: {{ nap.latencia }} · Duración: {{ nap.duracion }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:8px;\">\n          <div><label>Hora de acostar<\u002Flabel><input type=\"time\" value=\"{{ nap.bedtime }}\" sc-camel-on-change=\"{{ nap.onBedtime }}\"><\u002Fdiv>\n          <div><label>Hora en que se duerme<\u002Flabel><input type=\"time\" value=\"{{ nap.onset }}\" sc-camel-on-change=\"{{ nap.onOnset }}\"><\u002Fdiv>\n          <div><label>Hora de despertar<\u002Flabel><input type=\"time\" value=\"{{ nap.wake }}\" sc-camel-on-change=\"{{ nap.onWake }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <label>¿Cómo se duerme? ¿Le tienes que redormir?<\u002Flabel>\n        <input value=\"{{ nap.note }}\" sc-camel-on-change=\"{{ nap.onNote }}\" placeholder=\"En brazos, se despierta a los 20 min y hay que redormir...\">\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"display:flex; gap:10px; margin-top:14px;\">\n      <sc-if value=\"{{ curDay.canAddNap }}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{ curDay.onAddNap }}\" style=\"background:#EFEBFA; color:#4E2780; border:none; border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:600;\">+ Añadir siesta<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ curDay.canRemoveNap }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ curDay.onRemoveNap }}\" style=\"background:#F7F6F3; color:#9994B8; border:none; border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:600;\">– Quitar última<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"margin-top:12px; font-size:12.5px; color:#9994B8;\">Total sueño diurno: <b style=\"color:#4E2780;\">{{ curDay.totalDiurno }}<\u002Fb><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- NOCHE -->\n  <div style=\"width:100%; max-width:620px; background:#fff; border-radius:16px; padding:18px;\">\n    <div style=\"font-family:'Quicksand',sans-serif; font-weight:700; font-size:15px; color:#3D3555; margin-bottom:10px;\">Noche<\u002Fdiv>\n    <div style=\"font-size:11.5px; color:#9994B8; margin-bottom:8px;\">Ventana antes de acostarse: {{ curDay.ventanaNoche }} · Latencia nocturna: {{ curDay.latenciaNocturna }}<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;\">\n      <div><label>Hora de acostar<\u002Flabel><input type=\"time\" value=\"{{ curDay.nightBedtime }}\" sc-camel-on-change=\"{{ curDay.onNightBedtime }}\"><\u002Fdiv>\n      <div><label>Hora en que se duerme<\u002Flabel><input type=\"time\" value=\"{{ curDay.nightOnset }}\" sc-camel-on-change=\"{{ curDay.onNightOnset }}\"><\u002Fdiv>\n    <\u002Fdiv>\n    <label>¿Cómo se duerme? Describe qué necesita para dormirse<\u002Flabel>\n    <input value=\"{{ curDay.nightNote }}\" sc-camel-on-change=\"{{ curDay.onNightNote }}\">\n  <\u002Fdiv>\n\n  <!-- DESPERTARES NOCTURNOS -->\n  <div style=\"width:100%; max-width:620px; background:#fff; border-radius:16px; padding:18px;\">\n    <div style=\"font-family:'Quicksand',sans-serif; font-weight:700; font-size:15px; color:#3D3555; margin-bottom:4px;\">Despertares nocturnos<\u002Fdiv>\n    <div style=\"font-size:11.5px; color:#9994B8; margin-bottom:8px;\">Nº despertares: {{ curDay.nDespertares }} · Vigilia intrasueño: {{ curDay.vigiliaWaso }}<\u002Fdiv>\n    <sc-for list=\"{{ curDay.wakings }}\" as=\"wk\" hint-placeholder-count=\"0\">\n      <div style=\"border-top:1px solid #EEECF6; padding-top:10px; margin-top:10px;\">\n        <div style=\"font-family:'Quicksand',sans-serif; font-weight:600; font-size:13px; color:#4E2780; margin-bottom:6px;\">Despertar {{ wk.n }} <span style=\"font-weight:400; color:#9994B8; font-size:11.5px;\">({{ wk.duracion }})<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px;\">\n          <div><label>Hora de inicio<\u002Flabel><input type=\"time\" value=\"{{ wk.start }}\" sc-camel-on-change=\"{{ wk.onStart }}\"><\u002Fdiv>\n          <div><label>Hora de fin<\u002Flabel><input type=\"time\" value=\"{{ wk.end }}\" sc-camel-on-change=\"{{ wk.onEnd }}\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"display:flex; gap:10px; margin-top:14px;\">\n      <sc-if value=\"{{ curDay.canAddWaking }}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{ curDay.onAddWaking }}\" style=\"background:#EFEBFA; color:#4E2780; border:none; border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:600;\">+ Añadir despertar<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ curDay.canRemoveWaking }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ curDay.onRemoveWaking }}\" style=\"background:#F7F6F3; color:#9994B8; border:none; border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:600;\">– Quitar último<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"margin-top:14px;\">\n      <label>¿Cómo se reduerme en los despertares?<\u002Flabel>\n      <input value=\"{{ curDay.reasleepNote }}\" sc-camel-on-change=\"{{ curDay.onReasleepNote }}\" placeholder=\"Cuéntame, a grosso modo, cómo suele ser la noche: si le coges en brazos, si le das el pecho/biberón, si entra en la cama con vosotros...\">\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;\">\n      <div><label>Hora de las tomas nocturnas<\u002Flabel><input value=\"{{ curDay.feedTimes }}\" sc-camel-on-change=\"{{ curDay.onFeedTimes }}\" placeholder=\"ej. 1:20, 4:45\"><\u002Fdiv>\n      <div><label>Nº tomas nocturnas<\u002Flabel><input type=\"number\" min=\"0\" value=\"{{ curDay.feedCount }}\" sc-camel-on-change=\"{{ curDay.onFeedCount }}\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CIERRE NOCHE -->\n  <div style=\"width:100%; max-width:620px; background:#fff; border-radius:16px; padding:18px;\">\n    <div style=\"font-family:'Quicksand',sans-serif; font-weight:700; font-size:15px; color:#3D3555; margin-bottom:10px;\">Cierre de la noche<\u002Fdiv>\n    <div style=\"font-size:11.5px; color:#9994B8; margin-bottom:8px;\">Periodo de sueño más largo: {{ curDay.periodoMasLargo }}<\u002Fdiv>\n    <label>Hora despertar por la mañana (cierra la noche de este día)<\u002Flabel>\n    <input type=\"time\" value=\"{{ curDay.wakeClose }}\" sc-camel-on-change=\"{{ curDay.onWakeClose }}\" style=\"max-width:200px; margin-bottom:10px;\">\n    <label>¿Qué hacéis cuando se despierta por la mañana?<\u002Flabel>\n    <input value=\"{{ curDay.morningAction }}\" sc-camel-on-change=\"{{ curDay.onMorningAction }}\">\n  <\u002Fdiv>\n\n  <!-- TOTALES -->\n  <div style=\"width:100%; max-width:620px; background:#EFEBFA; border-radius:16px; padding:18px;\">\n    <div style=\"font-family:'Quicksand',sans-serif; font-weight:700; font-size:15px; color:#4E2780; margin-bottom:10px;\">Totales del día<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; font-size:13.5px; color:#3D3555;\">\n      <div>Sueño diurno: <b>{{ curDay.totalDiurno }}<\u002Fb><\u002Fdiv>\n      <div>Sueño nocturno: <b>{{ curDay.totalNocturno }}<\u002Fb><\u002Fdiv>\n      <div>Sueño diario: <b>{{ curDay.totalDiario }}<\u002Fb><\u002Fdiv>\n      <div>Vigilia intrasueño: <b>{{ curDay.vigiliaWaso }}<\u002Fb><\u002Fdiv>\n      <div>Periodo más largo: <b>{{ curDay.periodoMasLargo }}<\u002Fb><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:100%; max-width:620px; background:#fff; border-radius:16px; padding:18px;\">\n    <label>Observaciones<\u002Flabel>\n    <textarea rows=\"3\" style=\"resize:vertical;\" value=\"{{ curDay.observations }}\" sc-camel-on-change=\"{{ curDay.onObservations }}\" placeholder=\"Algo puntual que explique este día: una vacuna, un viaje, estaba enfermo...\"><\u002Ftextarea>\n  <\u002Fdiv>\n\n  <div style=\"width:100%; max-width:620px; background:#EFEBFA; border-radius:16px; padding:18px;\">\n    <div style=\"font-family:'Quicksand',sans-serif; font-weight:700; font-size:15px; color:#4E2780; margin-bottom:10px;\">Promedios de la semana (para \"antes de empezar\")<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px 14px; font-size:13px; color:#3D3555; margin-bottom:6px;\">\n      <div>Despertares/noche: <b>{{ avgWakings }}<\u002Fb><\u002Fdiv>\n      <div>Latencia media: <b>{{ avgLatencyLabel }}<\u002Fb><\u002Fdiv>\n      <div>Tramo más largo: <b>{{ avgLongestLabel }}<\u002Fb><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"no-print\" style=\"width:100%; max-width:620px; display:flex; justify-content:flex-end;\">\n    <sc-if value=\"{{ hasNextDay }}\" hint-placeholder-val=\"{{ true }}\">\n      <button sc-camel-on-click=\"{{ onNextDay }}\" style=\"background:#4E2780; color:#fff; border:none; border-radius:10px; padding:9px 16px; font-size:13px; font-weight:600;\">Siguiente día →<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"width:100%; max-width:620px; background:#fff; border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:10px;\">\n    <div style=\"font-size:12px; color:#9994B8;\">Tus respuestas se guardan solas en este dispositivo mientras rellenas — puedes cerrar y volver otro día sin perder nada. <b>Pulsa \"Enviar mis datos\" una sola vez, cuando hayas terminado de registrar todos los días<\u002Fb> (no lo hagas cada día, o se mezclarán varios envíos tuyos).<\u002Fdiv>\n    <sc-if value=\"{{ canSend }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex; gap:10px; flex-wrap:wrap;\">\n        <button sc-camel-on-click=\"{{ onSendToSheet }}\" style=\"background:#AB1D79; color:#fff; border:none; border-radius:10px; padding:10px 18px; font-size:13px; font-weight:600;\">Enviar mis datos (al terminar el registro)<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ cannotSend }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"font-size:12.5px; color:#AB1D79; font-weight:600;\">Te faltan {{ daysUntilSendable }} día(s) completo(s) para poder enviar (mínimo 5 días registrados).<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ copyMessage }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:12.5px; color:#4E2780; font-weight:600;\">{{ copyMessage }}<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showValidationModal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; background:rgba(61,53,85,0.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:1000;\">\n      <div style=\"background:#fff; border-radius:16px; padding:24px 26px; max-width:440px; width:100%; max-height:80vh; overflow-y:auto;\">\n        <div style=\"font-family:'Quicksand',sans-serif; font-weight:700; font-size:16px; color:#AB1D79; margin-bottom:10px;\">Faltan algunos datos<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#3D3555; margin-bottom:14px; line-height:1.5;\">Para que los cálculos del registro (como la vigilia intrasueño o la duración de las siestas) sean correctos, necesito estos datos antes de continuar:<\u002Fdiv>\n        <sc-for list=\"{{ missingItems }}\" as=\"item\" hint-placeholder-count=\"2\">\n          <div style=\"margin-bottom:10px;\">\n            <div style=\"font-family:'Quicksand',sans-serif; font-weight:600; font-size:13.5px; color:#4E2780;\">{{ item.label }}<\u002Fdiv>\n            <sc-if value=\"{{ item.explain }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:12.5px; color:#9994B8; line-height:1.4;\">{{ item.explain }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <button sc-camel-on-click=\"{{ onCloseValidationModal }}\" style=\"margin-top:8px; background:#4E2780; color:#fff; border:none; border-radius:10px; padding:9px 18px; font-size:13px; font-weight:600;\">Entendido, voy a rellenarlo<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showTimeWarning }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; background:rgba(61,53,85,0.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:1000;\">\n      <div style=\"background:#fff; border-radius:16px; padding:24px 26px; max-width:420px; width:100%;\">\n        <div style=\"font-family:'Quicksand',sans-serif; font-weight:700; font-size:16px; color:#AB1D79; margin-bottom:10px;\">¿Seguro que la hora es correcta?<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#3D3555; margin-bottom:16px; line-height:1.5;\">{{ timeWarningMessage }}<\u002Fdiv>\n        <div style=\"display:flex; gap:10px; justify-content:flex-end;\">\n          <button sc-camel-on-click=\"{{ onReviewTimeWarning }}\" style=\"background:#EFEBFA; color:#4E2780; border:none; border-radius:10px; padding:9px 16px; font-size:13px; font-weight:600;\">Revisar<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onConfirmTimeWarning }}\" style=\"background:#4E2780; color:#fff; border:none; border-radius:10px; padding:9px 16px; font-size:13px; font-weight:600;\">Sí, es correcto<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SHEET_ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbwNxcx6c_KU2-9QP-VkYRyA4mc5LrEXNOFsQXnPgeO2BHyX-vii3sdqsu_undN0RUSDiA/exec';\n\nclass Component extends DCLogic {\n  state = {\n    familyLabel: '',\n    babyBirthDate: '',\n    parentName: '',\n    parentEmail: '',\n    parentPhone: '',\n    marketingConsent: false,\n    caseContext: '',\n    feeding: '',\n    acStarted: '',\n    weightOk: '',\n    termType: '',\n    gestWeeks: '',\n    medicalIssue: '',\n    medicalIssueDetail: '',\n    startDate: '2026-07-27',\n    activeDay: 0,\n    copyMessage: '',\n    submitted: false,\n    showValidationModal: false,\n    missingItems: [],\n    showTimeWarning: false,\n    timeWarningMessage: '',\n    pendingWarningKey: null,\n    pendingWarningDay: null,\n    confirmedWarnings: {},\n    days: [0,1,2,3,4,5,6].map(() => this.blankDay()),\n  };\n\n  static DRAFT_KEY = 'registro_sueno_evaluacion_draft_v1';\n  static SESSION_KEY = 'registro_sueno_evaluacion_session_id_v1';\n\n  genUuid() {\n    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();\n    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {\n      const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);\n      return v.toString(16);\n    });\n  }\n\n  resetSessionId() {\n    const id = this.genUuid();\n    try { localStorage.setItem(Component.SESSION_KEY, id); } catch (e) { this._sessionIdFallback = id; }\n    return id;\n  }\n\n  getSessionId() {\n    try {\n      let id = localStorage.getItem(Component.SESSION_KEY);\n      if (!id) { id = this.genUuid(); localStorage.setItem(Component.SESSION_KEY, id); }\n      return id;\n    } catch (e) { return this._sessionIdFallback || (this._sessionIdFallback = this.genUuid()); }\n  }\n\n  blankFormState() {\n    return {\n      familyLabel: '', babyBirthDate: '', parentName: '', parentEmail: '', parentPhone: '',\n      marketingConsent: false, caseContext: '', feeding: '', acStarted: '',\n      weightOk: '', termType: '', gestWeeks: '', medicalIssue: '', medicalIssueDetail: '',\n      startDate: '2026-07-27', activeDay: 0, copyMessage: '',\n      days: [0,1,2,3,4,5,6].map(() => this.blankDay()),\n    };\n  }\n\n  componentDidMount() {\n    try {\n      const saved = localStorage.getItem(Component.DRAFT_KEY);\n      if (saved) {\n        const parsed = JSON.parse(saved);\n        this.setState(parsed);\n      }\n    } catch (e) {}\n  }\n\n  componentDidUpdate() {\n    if (this.state.submitted) { clearTimeout(this._autosaveTimer); return; }\n    try {\n      const { copyMessage, showValidationModal, missingItems, showTimeWarning, timeWarningMessage, pendingWarningKey, pendingWarningDay, ...persist } = this.state;\n      localStorage.setItem(Component.DRAFT_KEY, JSON.stringify(persist));\n    } catch (e) {}\n    clearTimeout(this._autosaveTimer);\n    this._autosaveTimer = setTimeout(() => this.sendAutosave(), 2000);\n  }\n\n  sendAutosave() {\n    if (!SHEET_ENDPOINT_URL) return;\n    const s = this.state;\n    const hasAnyDayData = s.days.some(day =>\n      day.wakeMorning || day.nightBedtime || day.nightOnset ||\n      (day.naps && day.naps.length > 0) || (day.wakings && day.wakings.length > 0)\n    );\n    if (!s.familyLabel && !hasAnyDayData) return; // formulario vacío: no autoguardar nada\n    const payload = {\n      action: 'autosave', sessionId: this.getSessionId(),\n      babyName: s.familyLabel, babyBirthDate: s.babyBirthDate, parentName: s.parentName,\n      parentEmail: s.parentEmail, parentPhone: s.parentPhone,\n      marketingConsent: s.marketingConsent ? 'si' : 'no', consentDate: new Date().toISOString().slice(0, 10),\n      caseContext: s.caseContext, feeding: s.feeding, acStarted: s.acStarted, weightOk: s.weightOk, termType: s.termType,\n      gestWeeks: s.gestWeeks, medicalIssue: s.medicalIssue, medicalIssueDetail: s.medicalIssueDetail,\n      daysJson: s.days.map((day, i) => JSON.stringify(Object.assign({ label: this.dayLabelFull(i) }, day))),\n    };\n    fetch(SHEET_ENDPOINT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }).catch(() => {});\n  }\n\n  blankDay() {\n    return {\n      wakeMorning: '',\n      naps: [],\n      nightBedtime: '', nightOnset: '', nightNote: '',\n      wakings: [],\n      reasleepNote: '', feedTimes: '', feedCount: '',\n      wakeClose: '', morningAction: '',\n      observations: '',\n    };\n  }\n\n  toMin(t) { if (!t) return null; const p = t.split(':'); if (p.length < 2) return null; return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }\n  diff(a, b) { const x = this.toMin(a), y = this.toMin(b); if (x == null || y == null) return null; let d = y - x; if (d < 0) d += 1440; return d; }\n  fmt(min) { if (min == null) return '—'; const h = Math.floor(min / 60), m = Math.round(min % 60); return h + ':' + String(m).padStart(2, '0'); }\n  fmtOrDash(min) { return min == null ? '—' : this.fmt(min); }\n\n  calcDay(day) {\n    const naps = day.naps;\n    let prevWake = day.wakeMorning;\n    const napCalc = naps.map((n, i) => {\n      const ventana = this.diff(prevWake, n.bedtime);\n      const latencia = this.diff(n.bedtime, n.onset);\n      const duracion = this.diff(n.onset, n.wake);\n      if (n.wake) prevWake = n.wake;\n      return { ventana, latencia, duracion };\n    });\n    const totalDiurnoMin = napCalc.reduce((s, c) => s + (c.duracion || 0), 0);\n    const ventanasDiaMin = napCalc.reduce((s, c) => s + (c.ventana || 0), 0);\n    const ventanaNoche = this.diff(prevWake, day.nightBedtime);\n    const latenciaNocturna = this.diff(day.nightBedtime, day.nightOnset);\n\n    const wakingCalc = day.wakings.map(w => ({ duracion: this.diff(w.start, w.end) }));\n    const nDespertares = day.wakings.filter(w => w.start && w.end).length;\n    const vigiliaMin = wakingCalc.reduce((s, c) => s + (c.duracion || 0), 0);\n\n    // Night sleep points: onset -> wakings (start/end pairs) -> wakeClose\n    let points = [];\n    if (day.nightOnset) points.push(day.nightOnset);\n    day.wakings.forEach(w => { if (w.start && w.end) points.push(w.start, w.end); });\n    if (day.wakeClose) points.push(day.wakeClose);\n    let longestMin = null, totalNocturnoMin = null;\n    if (points.length >= 2) {\n      let longest = 0, totalSleep = 0;\n      for (let i = 0; i < points.length - 1; i += 2) {\n        const seg = this.diff(points[i], points[i + 1]);\n        if (seg != null) { totalSleep += seg; if (seg > longest) longest = seg; }\n      }\n      longestMin = longest;\n      totalNocturnoMin = totalSleep;\n    }\n    const totalDiarioMin = (totalNocturnoMin || 0) + totalDiurnoMin;\n\n    return {\n      napCalc, totalDiurnoMin, ventanasDiaMin, ventanaNoche, latenciaNocturna,\n      wakingCalc, nDespertares, vigiliaMin, longestMin, totalNocturnoMin, totalDiarioMin,\n    };\n  }\n\n  isDayStarted(day) {\n    return !!(day.wakeMorning || day.nightBedtime || day.nightOnset || day.nightNote || day.wakeClose ||\n      day.morningAction || day.observations || day.reasleepNote || day.feedTimes || day.feedCount ||\n      (day.naps && day.naps.length) || (day.wakings && day.wakings.length));\n  }\n\n  getMissingForDay(day, dayLabel) {\n    const missing = [];\n    if (!this.isDayStarted(day)) return missing;\n    const prefix = dayLabel ? dayLabel + ' — ' : '';\n    if (!day.wakeMorning) missing.push({ label: prefix + 'Hora de despertar de la mañana', explain: 'Sin ella no se puede calcular la ventana de sueño antes de la primera siesta.' });\n    day.naps.forEach((n, i) => {\n      if (!n.bedtime) missing.push({ label: prefix + 'Siesta ' + (i + 1) + ' — hora de acostar', explain: '' });\n      if (!n.onset) missing.push({ label: prefix + 'Siesta ' + (i + 1) + ' — hora en que se duerme', explain: 'Necesaria para calcular la latencia y la duración de la siesta.' });\n      if (!n.wake) missing.push({ label: prefix + 'Siesta ' + (i + 1) + ' — hora de despertar', explain: 'Necesaria para calcular cuánto duró la siesta.' });\n    });\n    if (!day.nightBedtime) missing.push({ label: prefix + 'Noche — hora de acostar', explain: '' });\n    if (!day.nightOnset) missing.push({ label: prefix + 'Noche — hora en que se duerme', explain: 'Necesaria para calcular la latencia nocturna.' });\n    day.wakings.forEach((w, i) => {\n      if (!w.start) missing.push({ label: prefix + 'Despertar ' + (i + 1) + ' — hora de inicio', explain: '' });\n      if (!w.end) missing.push({ label: prefix + 'Despertar ' + (i + 1) + ' — hora de fin', explain: 'Sin esta hora no se puede calcular cuánto duró el despertar ni la vigilia intrasueño (WASO).' });\n    });\n    if (!day.wakeClose) missing.push({ label: prefix + 'Cierre de la noche — hora de despertar por la mañana', explain: 'Necesaria para calcular el sueño nocturno total y el tramo de sueño más largo.' });\n    return missing;\n  }\n\n  goToDay(i) {\n    this.setState(s => {\n      const days = s.days.slice();\n      if (i > 0 && !days[i].wakeMorning && days[i - 1].wakeClose) {\n        days[i] = Object.assign({}, days[i], { wakeMorning: days[i - 1].wakeClose });\n      }\n      return { days, activeDay: i };\n    });\n    if (typeof window !== 'undefined') {\n      setTimeout(() => {\n        const el = document.getElementById('despertar-manana');\n        const top = el ? el.getBoundingClientRect().top + window.pageYOffset - 20 : 0;\n        window.scrollTo({ top, behavior: 'smooth' });\n      }, 50);\n    }\n  }\n\n  setDay(idx, patch) {\n    this.setState(s => {\n      const days = s.days.slice();\n      days[idx] = Object.assign({}, days[idx], patch);\n      return { days };\n    }, () => this.maybeWarn(idx));\n  }\n  setNap(idx, napIdx, field, value) {\n    this.setState(s => {\n      const days = s.days.slice();\n      const naps = days[idx].naps.slice();\n      naps[napIdx] = Object.assign({}, naps[napIdx], { [field]: value });\n      days[idx] = Object.assign({}, days[idx], { naps });\n      return { days };\n    }, () => this.maybeWarn(idx));\n  }\n  setWaking(idx, wIdx, field, value) {\n    this.setState(s => {\n      const days = s.days.slice();\n      const wakings = days[idx].wakings.slice();\n      wakings[wIdx] = Object.assign({}, wakings[wIdx], { [field]: value });\n      days[idx] = Object.assign({}, days[idx], { wakings });\n      return { days };\n    }, () => this.maybeWarn(idx));\n  }\n\n  computeWarnings(day) {\n    const warnings = [];\n    const checkDur = (a, b, key, label) => {\n      if (!a || !b) return;\n      const dur = this.diff(a, b);\n      if (dur != null && dur > 240) {\n        const h = Math.floor(dur / 60), m = dur % 60;\n        warnings.push({ key, message: 'Est' + label + ' duraría más de 4 horas (' + h + 'h ' + m + 'min). ¿Seguro que las horas son correctas?' });\n      }\n    };\n    day.naps.forEach((n, i) => {\n      checkDur(n.bedtime, n.onset, 'nap-' + i + '-latencia', 'a latencia de la siesta ' + (i + 1));\n      checkDur(n.onset, n.wake, 'nap-' + i + '-dur', 'a siesta ' + (i + 1));\n    });\n    checkDur(day.nightBedtime, day.nightOnset, 'night-latencia', 'a latencia nocturna');\n    day.wakings.forEach((w, i) => {\n      if (w.start && w.end) {\n        const dur = this.diff(w.start, w.end);\n        if (dur != null && dur > 240) {\n          const h = Math.floor(dur / 60), m = dur % 60;\n          warnings.push({ key: 'waking-' + i + '-dur', message: 'Este despertar duraría más de 4 horas (' + h + 'h ' + m + 'min). ¿Seguro que las horas son correctas?' });\n        }\n      }\n    });\n    const points = [];\n    if (day.nightOnset) points.push({ key: 'nightOnset', label: 'hora en que se duerme por la noche', t: day.nightOnset });\n    day.wakings.forEach((w, i) => {\n      if (w.start) points.push({ key: 'waking-' + i + '-start', label: 'inicio del despertar ' + (i + 1), t: w.start });\n      if (w.end) points.push({ key: 'waking-' + i + '-end', label: 'fin del despertar ' + (i + 1), t: w.end });\n    });\n    if (day.wakeClose) points.push({ key: 'wakeClose', label: 'hora de despertar por la mañana', t: day.wakeClose });\n    for (let i = 1; i < points.length; i++) {\n      const prevMin = this.toMin(points[i - 1].t), curMin = this.toMin(points[i].t);\n      if (prevMin != null && curMin != null && curMin < prevMin && prevMin < 1140) {\n        warnings.push({ key: 'order-' + points[i].key, message: 'La ' + points[i].label + ' (' + points[i].t + ') es anterior a la ' + points[i - 1].label + ' (' + points[i - 1].t + '). ¿Seguro que las horas son correctas?' });\n      }\n    }\n    return warnings;\n  }\n\n  maybeWarn(dayIdx) {\n    const day = this.state.days[dayIdx];\n    const confirmed = this.state.confirmedWarnings[dayIdx] || {};\n    const warnings = this.computeWarnings(day).filter(w => !confirmed[w.key]);\n    if (warnings.length) {\n      this.setState({ showTimeWarning: true, timeWarningMessage: warnings[0].message, pendingWarningKey: warnings[0].key, pendingWarningDay: dayIdx });\n    }\n  }\n\n  ageLabel(birthDate) {\n    if (!birthDate) return 'sin fecha';\n    const b = new Date(birthDate + 'T00:00:00');\n    const today = new Date();\n    let months = (today.getFullYear() - b.getFullYear()) * 12 + (today.getMonth() - b.getMonth());\n    if (today.getDate() < b.getDate()) months--;\n    if (months < 0) return 'fecha futura';\n    if (months < 1) {\n      const days = Math.max(0, Math.round((today - b) / 86400000));\n      return days + (days === 1 ? ' día' : ' días');\n    }\n    if (months < 24) return months + (months === 1 ? ' mes' : ' meses');\n    const years = Math.floor(months / 12), rem = months % 12;\n    return years + (years === 1 ? ' año' : ' años') + (rem ? ' y ' + rem + (rem === 1 ? ' mes' : ' meses') : '');\n  }\n\n  dateDiffYMD(from, to) {\n    let y = to.getFullYear() - from.getFullYear();\n    let m = to.getMonth() - from.getMonth();\n    let d = to.getDate() - from.getDate();\n    if (d < 0) {\n      m--;\n      const prevMonth = new Date(to.getFullYear(), to.getMonth(), 0);\n      d += prevMonth.getDate();\n    }\n    if (m < 0) { y--; m += 12; }\n    return { y, m, d };\n  }\n\n  correctedAgeLabel(birthDate, gestInput) {\n    if (!birthDate || !gestInput) return 'indica semanas+días';\n    const parts = String(gestInput).split('+');\n    const weeks = parseFloat(parts[0]);\n    const extraDays = parts[1] ? parseFloat(parts[1]) : 0;\n    if (isNaN(weeks)) return 'indica semanas+días';\n    const today = new Date();\n    const b = new Date(birthDate + 'T00:00:00');\n    if (weeks >= 40) {\n      const { y, m, d } = this.dateDiffYMD(b, today);\n      return y + ' años, ' + m + ' meses y ' + d + ' días';\n    }\n    const offsetDays = (40 - weeks) * 7 - extraDays;\n    const corrected = new Date(b);\n    corrected.setDate(corrected.getDate() + offsetDays);\n    if (today < corrected) return '0 años, 0 meses y 0 días';\n    const { y, m, d } = this.dateDiffYMD(corrected, today);\n    return y + ' años, ' + m + ' meses y ' + d + ' días';\n  }\n\n  dayLabel(i) {\n    const s = this.state;\n    if (!s.startDate) return 'Día ' + (i + 1);\n    const d = new Date(s.startDate + 'T00:00:00');\n    d.setDate(d.getDate() + i);\n    let label = d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });\n    return label.charAt(0).toUpperCase() + label.slice(1);\n  }\n  dayLabelFull(i) {\n    const s = this.state;\n    if (!s.startDate) return 'Día ' + (i + 1);\n    const d = new Date(s.startDate + 'T00:00:00');\n    d.setDate(d.getDate() + i);\n    let label = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });\n    return label;\n  }\n\n  buildRows(day, calc) {\n    const rows = [];\n    const push = v => rows.push(v);\n    push(day.wakeMorning || '');\n    push(''); // SIESTA 1\n    for (let i = 0; i < 5; i++) {\n      const n = day.naps[i], c = calc.napCalc[i];\n      if (i > 0) push(''); // section header for siesta 2-5\n      push(c ? this.fmtOrDash(c.ventana) : '');\n      push(n ? n.bedtime || '' : '');\n      push(n ? n.onset || '' : '');\n      push(c ? this.fmtOrDash(c.latencia) : '');\n      push(n ? n.wake || '' : '');\n      push(c ? this.fmtOrDash(c.duracion) : '');\n      push(n ? n.note || '' : '');\n    }\n    push(this.fmtOrDash(calc.ventanasDiaMin));\n    push(this.fmtOrDash(calc.totalDiurnoMin));\n    push(''); // NOCHE\n    push(this.fmtOrDash(calc.ventanaNoche));\n    push(day.nightBedtime || '');\n    push(day.nightOnset || '');\n    push(this.fmtOrDash(calc.latenciaNocturna));\n    push(day.nightNote || '');\n    push(''); // DESPERTARES NOCTURNOS\n    push(String(calc.nDespertares));\n    for (let i = 0; i < 10; i++) {\n      const w = day.wakings[i];\n      push(w ? w.start || '' : '');\n      push(w ? w.end || '' : '');\n    }\n    push(day.reasleepNote || '');\n    push(day.feedTimes || '');\n    push(String(day.feedCount || ''));\n    push(this.fmtOrDash(calc.vigiliaMin));\n    push(this.fmtOrDash(calc.longestMin));\n    push(day.wakeClose || '');\n    push(day.morningAction || '');\n    push(''); // TOTALES\n    push(this.fmtOrDash(calc.totalDiurnoMin));\n    push(this.fmtOrDash(calc.totalNocturnoMin));\n    push(this.fmtOrDash(calc.totalDiarioMin));\n    push(this.fmtOrDash(calc.vigiliaMin));\n    push(this.fmtOrDash(calc.longestMin));\n    push(day.observations || '');\n    return rows;\n  }\n\n  reportRows() {\n    const s = this.state;\n    const header = ['Dia', 'Sueno diurno', 'Sueno nocturno', 'Despertares', 'Latencia', 'Vigilia (WASO)', 'Tramo mas largo'];\n    const lines = [header.join('\\t')];\n    let wSum = 0, wN = 0, latSum = 0, latN = 0, longSum = 0, longN = 0;\n    const rows = [];\n    s.days.forEach((d, i) => {\n      const c = this.calcDay(d);\n      const hasData = d.wakeMorning || d.nightBedtime || d.naps.some(n => n.bedtime);\n      if (hasData) lines.push([\n        this.dayLabelFull(i),\n        this.fmtOrDash(c.totalDiurnoMin),\n        this.fmtOrDash(c.totalNocturnoMin),\n        String(c.nDespertares),\n        this.fmtOrDash(c.latenciaNocturna),\n        this.fmtOrDash(c.vigiliaMin),\n        this.fmtOrDash(c.longestMin),\n      ].join('\\t'));\n      rows.push({\n        day: this.dayLabelFull(i),\n        wakeMorning: hasData ? (d.wakeMorning || '') : '',\n        dayNap: hasData ? this.fmtOrDash(c.totalDiurnoMin) : '',\n        nightSleep: hasData ? this.fmtOrDash(c.totalNocturnoMin) : '',\n        wakings: hasData ? c.nDespertares : '',\n        latency: hasData ? this.fmtOrDash(c.latenciaNocturna) : '',\n        waso: hasData ? this.fmtOrDash(c.vigiliaMin) : '',\n        longest: hasData ? this.fmtOrDash(c.longestMin) : '',\n        observations: hasData ? (d.observations || '') : '',\n      });\n      if (hasData) {\n        wSum += c.nDespertares; wN++;\n        if (c.latenciaNocturna != null) { latSum += c.latenciaNocturna; latN++; }\n        if (c.longestMin != null) { longSum += c.longestMin; longN++; }\n      }\n    });\n    return {\n      text: lines.join('\\n'),\n      rows,\n      avgWakings: wN ? (wSum / wN).toFixed(1) : '—',\n      avgLatencyMin: latN ? Math.round(latSum / latN) : null,\n      avgLongestMin: longN ? Math.round(longSum / longN) : null,\n    };\n  }\n\n  sendToSheet(report) {\n    try {\n      const s = this.state;\n      if (!SHEET_ENDPOINT_URL) { this.setState({ copyMessage: 'Aún no está conectado el envío automático — usa \"Copiar datos\".' }); setTimeout(() => this.setState({ copyMessage: '' }), 4000); return; }\n      const payload = {\n        action: 'submit', sessionId: this.getSessionId(),\n        tipo: 'evaluacion_gratuita', babyName: s.familyLabel, babyBirthDate: s.babyBirthDate,\n        parentName: s.parentName, parentEmail: s.parentEmail, parentPhone: s.parentPhone,\n        marketingConsent: s.marketingConsent ? 'si' : 'no',\n        consentDate: new Date().toISOString().slice(0, 10),\n        caseContext: s.caseContext, feeding: s.feeding, acStarted: s.acStarted, weightOk: s.weightOk, termType: s.termType,\n        gestWeeks: s.gestWeeks, medicalIssue: s.medicalIssue, medicalIssueDetail: s.medicalIssueDetail,\n        rows: report.rows,\n        daysJson: s.days.map((day, i) => JSON.stringify(Object.assign({ label: this.dayLabelFull(i) }, day))),\n      };\n      this.setState({ copyMessage: 'Enviando…' });\n      fetch(SHEET_ENDPOINT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })\n        .then(() => {\n          clearTimeout(this._autosaveTimer);\n          this.resetSessionId();\n          this.setState({ ...this.blankFormState(), submitted: true, copyMessage: '' });\n          try { localStorage.removeItem(Component.DRAFT_KEY); } catch (e) {}\n        })\n        .catch((err) => {\n          console.error('Error enviando a Sheets:', err);\n          this.setState({ copyMessage: 'No se pudo enviar (' + (err && err.message ? err.message : 'error') + '). Prueba a copiar los datos y envíamelos.' });\n        })\n        .finally(() => setTimeout(() => this.setState({ copyMessage: '' }), 6000));\n    } catch (err) {\n      console.error('Error preparando el envío:', err);\n      this.setState({ copyMessage: 'Error inesperado: ' + err.message });\n    }\n  }\n\n  copyToClipboard(text) {\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(text).catch(() => {});\n    }\n    this.setState({ copyMessage: 'Copiado ✓ Ahora pégalo en tu hoja de Sheets.' });\n    setTimeout(() => this.setState({ copyMessage: '' }), 4000);\n  }\n\n  renderVals() {\n    const s = this.state;\n    if (s.submitted) return { submitted: true, onStartNew: () => { clearTimeout(this._autosaveTimer); this.setState({ submitted: false }); } };\n    const activeDay = s.days[s.activeDay];\n    const calc = this.calcDay(activeDay);\n\n    const dayTabs = s.days.map((d, i) => ({\n      label: this.dayLabel(i),\n      onSelect: () => this.goToDay(i),\n      style: `border:none; border-radius:10px; padding:8px 12px; font-size:12px; font-weight:600; white-space:nowrap; flex-shrink:0; background:${i === s.activeDay ? '#4E2780' : '#fff'}; color:${i === s.activeDay ? '#fff' : '#736EB4'};`,\n    }));\n\n    const naps = activeDay.naps.map((n, i) => {\n      const c = calc.napCalc[i];\n      return {\n        n: i + 1,\n        bedtime: n.bedtime, onset: n.onset, wake: n.wake, note: n.note,\n        ventana: this.fmtOrDash(c.ventana), latencia: this.fmtOrDash(c.latencia), duracion: this.fmtOrDash(c.duracion),\n        onBedtime: e => this.setNap(s.activeDay, i, 'bedtime', e.target.value),\n        onOnset: e => this.setNap(s.activeDay, i, 'onset', e.target.value),\n        onWake: e => this.setNap(s.activeDay, i, 'wake', e.target.value),\n        onNote: e => this.setNap(s.activeDay, i, 'note', e.target.value),\n      };\n    });\n\n    const wakings = activeDay.wakings.map((w, i) => {\n      const c = calc.wakingCalc[i];\n      return {\n        n: i + 1, start: w.start, end: w.end, duracion: this.fmtOrDash(c.duracion),\n        onStart: e => this.setWaking(s.activeDay, i, 'start', e.target.value),\n        onEnd: e => this.setWaking(s.activeDay, i, 'end', e.target.value),\n      };\n    });\n\n    const curDay = {\n      wakeMorning: activeDay.wakeMorning,\n      onWakeMorning: e => this.setDay(s.activeDay, { wakeMorning: e.target.value }),\n      naps,\n      noNaps: activeDay.naps.length === 0,\n      canAddNap: activeDay.naps.length < 5,\n      canRemoveNap: activeDay.naps.length > 0,\n      onAddNap: () => this.setDay(s.activeDay, { naps: activeDay.naps.concat([{ bedtime: '', onset: '', wake: '', note: '' }]) }),\n      onRemoveNap: () => this.setDay(s.activeDay, { naps: activeDay.naps.slice(0, -1) }),\n      ventanasDia: this.fmtOrDash(calc.ventanasDiaMin),\n      totalDiurno: this.fmtOrDash(calc.totalDiurnoMin),\n      ventanaNoche: this.fmtOrDash(calc.ventanaNoche),\n      latenciaNocturna: this.fmtOrDash(calc.latenciaNocturna),\n      nightBedtime: activeDay.nightBedtime,\n      nightOnset: activeDay.nightOnset,\n      nightNote: activeDay.nightNote,\n      onNightBedtime: e => this.setDay(s.activeDay, { nightBedtime: e.target.value }),\n      onNightOnset: e => this.setDay(s.activeDay, { nightOnset: e.target.value }),\n      onNightNote: e => this.setDay(s.activeDay, { nightNote: e.target.value }),\n      wakings,\n      nDespertares: calc.nDespertares,\n      vigiliaWaso: this.fmtOrDash(calc.vigiliaMin),\n      canAddWaking: activeDay.wakings.length < 10,\n      canRemoveWaking: activeDay.wakings.length > 0,\n      onAddWaking: () => this.setDay(s.activeDay, { wakings: activeDay.wakings.concat([{ start: '', end: '' }]) }),\n      onRemoveWaking: () => this.setDay(s.activeDay, { wakings: activeDay.wakings.slice(0, -1) }),\n      reasleepNote: activeDay.reasleepNote,\n      onReasleepNote: e => this.setDay(s.activeDay, { reasleepNote: e.target.value }),\n      feedTimes: activeDay.feedTimes,\n      onFeedTimes: e => this.setDay(s.activeDay, { feedTimes: e.target.value }),\n      feedCount: activeDay.feedCount,\n      onFeedCount: e => this.setDay(s.activeDay, { feedCount: e.target.value }),\n      periodoMasLargo: this.fmtOrDash(calc.longestMin),\n      wakeClose: activeDay.wakeClose,\n      onWakeClose: e => this.setDay(s.activeDay, { wakeClose: e.target.value }),\n      morningAction: activeDay.morningAction,\n      onMorningAction: e => this.setDay(s.activeDay, { morningAction: e.target.value }),\n      totalNocturno: this.fmtOrDash(calc.totalNocturnoMin),\n      totalDiario: this.fmtOrDash(calc.totalDiarioMin),\n      observations: activeDay.observations,\n      onObservations: e => this.setDay(s.activeDay, { observations: e.target.value }),\n    };\n\n    const report = this.reportRows();\n    const completeDaysCount = s.days.filter(d => this.isDayStarted(d) && this.getMissingForDay(d).length === 0).length;\n    const canSend = completeDaysCount >= 5;\n\n    return {\n      familyLabel: s.familyLabel,\n      onFamilyLabel: e => this.setState({ familyLabel: e.target.value }),\n      babyBirthDate: s.babyBirthDate,\n      onBabyBirthDate: e => this.setState({ babyBirthDate: e.target.value }),\n      babyAgeLabel: this.ageLabel(s.babyBirthDate),\n      parentName: s.parentName,\n      onParentName: e => this.setState({ parentName: e.target.value }),\n      parentEmail: s.parentEmail,\n      onParentEmail: e => this.setState({ parentEmail: e.target.value }),\n      parentPhone: s.parentPhone,\n      onParentPhone: e => this.setState({ parentPhone: e.target.value }),\n      marketingConsent: s.marketingConsent,\n      marketingConsentMissing: !s.marketingConsent,\n      onMarketingConsent: e => this.setState({ marketingConsent: e.target.checked }),\n      caseContext: s.caseContext,\n      onCaseContext: e => this.setState({ caseContext: e.target.value }),\n      feeding: s.feeding,\n      onFeeding: e => this.setState({ feeding: e.target.value }),\n      acStarted: s.acStarted,\n      onAcStarted: e => this.setState({ acStarted: e.target.value }),\n      weightOk: s.weightOk,\n      onWeightOk: e => this.setState({ weightOk: e.target.value }),\n      termType: s.termType,\n      onTermType: e => this.setState({ termType: e.target.value }),\n      isPremature: s.termType === 'prematuro',\n      gestWeeks: s.gestWeeks,\n      onGestWeeks: e => this.setState({ gestWeeks: e.target.value }),\n      correctedAgeLabel: this.correctedAgeLabel(s.babyBirthDate, s.gestWeeks),\n      medicalIssue: s.medicalIssue,\n      onMedicalIssue: e => this.setState({ medicalIssue: e.target.value }),\n      hasMedicalIssue: s.medicalIssue === 'si',\n      medicalIssueDetail: s.medicalIssueDetail,\n      onMedicalIssueDetail: e => this.setState({ medicalIssueDetail: e.target.value }),\n      startDate: s.startDate,\n      onStartDate: e => this.setState({ startDate: e.target.value }),\n      dayTabs,\n      curDay,\n      hasNextDay: s.activeDay < 6,\n      onNextDay: () => {\n        const missing = this.getMissingForDay(activeDay);\n        if (missing.length) { this.setState({ showValidationModal: true, missingItems: missing }); return; }\n        this.goToDay(Math.min(6, s.activeDay + 1));\n      },\n      copyMessage: s.copyMessage,\n      avgWakings: report.avgWakings,\n      avgLatencyLabel: report.avgLatencyMin != null ? this.fmt(report.avgLatencyMin) : '—',\n      avgLongestLabel: report.avgLongestMin != null ? this.fmt(report.avgLongestMin) : '—',\n      onCopyForReport: () => this.copyToClipboard(report.text),\n      canSend, cannotSend: !canSend, daysUntilSendable: Math.max(0, 5 - completeDaysCount),\n      showValidationModal: s.showValidationModal,\n      missingItems: s.missingItems,\n      onCloseValidationModal: () => this.setState({ showValidationModal: false }),\n      showTimeWarning: s.showTimeWarning,\n      timeWarningMessage: s.timeWarningMessage,\n      onReviewTimeWarning: () => this.setState({ showTimeWarning: false }),\n      onConfirmTimeWarning: () => {\n        const dayIdx = s.pendingWarningDay, key = s.pendingWarningKey;\n        this.setState(prev => {\n          const confirmedWarnings = Object.assign({}, prev.confirmedWarnings);\n          confirmedWarnings[dayIdx] = Object.assign({}, confirmedWarnings[dayIdx], { [key]: true });\n          return { confirmedWarnings, showTimeWarning: false };\n        }, () => this.maybeWarn(dayIdx));\n      },\n      onSendToSheet: () => {\n        let allMissing = [];\n        s.days.forEach((d, i) => { allMissing = allMissing.concat(this.getMissingForDay(d, this.dayLabel(i))); });\n        if (allMissing.length) { this.setState({ showValidationModal: true, missingItems: allMissing }); return; }\n        this.sendToSheet(report);\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
